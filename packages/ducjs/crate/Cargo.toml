[package]
name = "ducjs-wasm"
version = "0.0.0-development"
edition = "2021"
description = "WASM bindings for the duc file format (used by ducjs)"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "ducjs-wasi"
path = "src/bin/wasi.rs"
required-features = ["wasi-bin"]

[features]
default = ["opfs"]
opfs = ["duc/opfs"]
wasi-bin = []

[dependencies]
duc = { path = "../../ducrs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"

# Browser-only dependencies — automatically included when building for
# wasm32-unknown-unknown (the browser WASM target).  Not needed for WASI.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
rusqlite = { version = "0.38", features = ["bundled", "serialize"] }
sqlite-wasm-vfs = "0.2"

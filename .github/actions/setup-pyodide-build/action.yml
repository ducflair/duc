name: 'Setup Pyodide Build'
description: 'Install pyodide-build tooling, cross-build environment, and validate wheel platform tag compatibility.'

inputs:
  pyodide-version:
    description: 'Pyodide runtime version for the xbuildenv (e.g. 0.29.4).'
    required: true
  pyodide-build-version:
    description: 'pyodide-build package version (e.g. 0.35.0). Separate from the runtime version.'
    required: true
  python-version:
    description: 'Python version for setup-python step'
    required: false
    default: '3.12'

outputs:
  pyodide-root:
    description: 'Path to the Pyodide cross-build root directory'
    value: ${{ steps.validate.outputs.pyodide_root }}
  wheel-platform-tag:
    description: 'Wheel platform tag (e.g. pyodide_2025_0_wasm32)'
    value: ${{ steps.validate.outputs.wheel_platform_tag }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pyodide-build and validate tooling
      id: validate
      shell: bash
      run: |
        PYODIDE_VERSION="${{ inputs.pyodide-version }}"
        PYODIDE_BUILD_VERSION="${{ inputs.pyodide-build-version }}"

        python -m pip install --upgrade pip
        pip install "pyodide-build==${PYODIDE_BUILD_VERSION}"

        # Verify pyodide CLI works
        pyodide --help > /dev/null

        # Install the matching cross-build environment explicitly.
        # pyodide-build >= 0.30.0 uses the new xbuildenv system and can
        # download and install the toolchain (including Emscripten and a
        # patched Rust nightly with wasm-eh support) automatically via
        # `pyodide xbuildenv install`. We pin the runtime version to
        # ensure the wheel targets the correct Pyodide runtime.
        pyodide xbuildenv install "${PYODIDE_VERSION}"

        # Derive PYODIDE_ROOT from the installed xbuildenv
        PYODIDE_ROOT=$(pyodide config get pyodide_root)

        if [ -z "$PYODIDE_ROOT" ] || [ ! -d "$PYODIDE_ROOT" ]; then
          echo "ERROR: PYODIDE_ROOT not found at $PYODIDE_ROOT"
          exit 1
        fi

        echo "PYODIDE_ROOT=$PYODIDE_ROOT" >> $GITHUB_ENV
        echo "pyodide_root=$PYODIDE_ROOT" >> $GITHUB_OUTPUT

        # Verify wheel platform tag — this is the tag used in the .whl filename.
        TAG=$(python3 -c "
        import os
        os.environ['PYODIDE_ROOT'] = '$PYODIDE_ROOT'
        from pyodide_build.build_env import wheel_platform
        print(wheel_platform())
        ")
        echo "wheel_platform_tag=$TAG" >> $GITHUB_OUTPUT
        echo "Pyodide wheel platform tag: $TAG"

        if echo "$TAG" | grep -qE "^(pyodide_|pyemscripten)_"; then
          echo "Wheel platform tag looks correct — OK (compatible with Pyodide ${PYODIDE_VERSION} runtime)"
        else
          echo "ERROR: Wheel platform tag is '$TAG', expected pyodide_* or pyemscripten_*"
          echo "This means the built wheel will NOT be compatible with the Pyodide ${PYODIDE_VERSION} runtime."
          exit 1
        fi
name: Audit npm registry signatures
description: Verify installed npm dependencies against registry signatures and provenance attestations.

runs:
  using: composite
  steps:
    - name: Verify registry signatures
      shell: bash
      run: |
        set -euo pipefail

        for attempt in 1 2 3; do
          echo "Running npm audit signatures (attempt ${attempt}/3)"
          if npm audit signatures; then
            exit 0
          fi

          if [ "$attempt" -lt 3 ]; then
            echo "Audit failed; retrying in $((attempt * 10)) seconds." >&2
            sleep "$((attempt * 10))"
          fi
        done

        echo "npm audit signatures failed after 3 attempts." >&2
        exit 1

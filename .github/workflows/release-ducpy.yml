name: Release Python

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_ducpy:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      PYODIDE_VERSION: "0.28.0"
      PYODIDE_BUILD_VERSION: "0.35.0"
    concurrency:
      group: release-ducpy
      cancel-in-progress: false
    outputs:
      release_status: ${{ steps.release.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set Git User
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Install Monorepo Dependencies
        run: bun install
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup release environment
        id: setup-release-environment
        uses: ./.github/actions/simulate-main-environment
        with:
          current-branch: ${{ github.ref_name }}
          package-name: ducpy

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if bunx semantic-release ${{ steps.setup-release-environment.outputs.release-mode }}; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
        working-directory: ./packages/ducpy

      - name: Setup Pyodide build tooling
        id: pyodide_tooling
        if: steps.release.outputs.status == 'success'
        uses: ./.github/actions/setup-pyodide-build
        with:
          pyodide-version: ${{ env.PYODIDE_VERSION }}
          pyodide-build-version: ${{ env.PYODIDE_BUILD_VERSION }}
          python-version: '3.13'

      - name: Build Pyodide wheel
        if: steps.release.outputs.status == 'success'
        working-directory: ./packages/ducpy
        env:
          PYODIDE_ROOT: ${{ steps.pyodide_tooling.outputs.pyodide-root }}
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'ducpy@*')
          VERSION="${TAG#ducpy@}"
          echo "Building Pyodide wheel for version ${VERSION}"
          SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION}" pyodide build --outdir dist

      - name: Verify wheel platform tag
        if: steps.release.outputs.status == 'success'
        working-directory: ./packages/ducpy
        run: |
          WHEEL=$(find dist -name '*.whl' | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: No wheel found in dist/"
            exit 1
          fi
          echo "Built wheel: $WHEEL"
          EXPECTED_TAG="${{ steps.pyodide_tooling.outputs.wheel-platform-tag }}"
          if echo "$WHEEL" | grep -q "$EXPECTED_TAG"; then
            echo "Wheel filename contains expected tag '$EXPECTED_TAG' — OK"
          else
            echo "ERROR: Wheel filename does not contain expected tag '$EXPECTED_TAG'"
            echo "This means the built wheel is incompatible with the Pyodide ${{ env.PYODIDE_VERSION }} runtime."
            exit 1
          fi

      - name: Upload wheels to GitHub release
        if: steps.release.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the tag created by semantic-release
          TAG=$(git describe --tags --abbrev=0 --match 'ducpy@*')
          echo "Uploading wheels from dist/ to release $TAG"

          # Upload all wheels and source distributions
          find packages/ducpy/dist -name "*.whl" -o -name "*.tar.gz" | while read file; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file" --clobber
          done

      - name: Deploy Python documentation
        if: steps.release.outputs.status == 'success'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: trigger-ducpy-docs-deployment
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify web deployment
        if: steps.release.outputs.status == 'success'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: trigger-web-deployment
          token: ${{ secrets.GITHUB_TOKEN }}
          client-payload: |
            {"source": "release-ducpy", "web_changed": "false", "success": "true"}

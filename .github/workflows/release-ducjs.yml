name: Release ducjs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release_ducjs:
    runs-on: ubuntu-latest
    concurrency:
      group: release-ducjs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set Git User
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install WASI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang wasi-libc

      - name: Install wasm-pack (pinned 0.14.x)
        run: cargo install wasm-pack --version 0.14.0 --locked --force


      - name: Install deps
        run: bun install

      - name: Build
        env:
          CC_wasm32_wasip1: /usr/bin/clang
          CFLAGS_wasm32_wasip1: --sysroot=/usr -isystem /usr/include/wasm32-wasi
        run: bun run --cwd packages/ducjs build:wasi

      - name: Verify WASI package artifact
        working-directory: ./packages/ducjs
        run: |
          test -s dist/ducjs_wasi.wasm
          npm_config_cache=/tmp/ducjs-npm-cache npm pack --dry-run --json | grep -q '"path": "dist/ducjs_wasi.wasm"'

      - name: Prepare workspace dependencies for publish
        run: node scripts/fix-workspace-deps.mjs packages/ducjs/package.json

      - name: Setup release environment
        id: setup-release-environment
        uses: ./.github/actions/simulate-main-environment
        with:
          current-branch: ${{ github.ref_name }}
          package-name: ducjs

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./packages/ducjs
        run: npx semantic-release ${{ steps.setup-release-environment.outputs.release-mode }}

      - name: Deploy API documentation
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: trigger-api-docs-deployment
          token: ${{ secrets.GITHUB_TOKEN }}

name: Deploy API Documentation & Package Index

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip deployment to GitHub Pages)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry run mode (skip deployment to GitHub Pages)'
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [trigger-api-docs-deployment, trigger-ducpy-docs-deployment]
  push:
    branches:
      - main
    paths:
      - 'packages/ducpy/docs/**'
      - 'packages/ducpy/src/ducpy/**'
      - 'packages/ducjs/src/**'
      - 'packages/ducrs/src/**'
      - 'packages/ducpdf/src/**'
      - 'packages/ducsvg/src/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # SQL API Docs (sq inspect -> /reference/sql/)
      - name: Install sq CLI
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://sq.io/install.sh)"

      - name: Build SQL HTML Documentation
        run: python3 scripts/gen-sql-docs.py

      - name: Install Sphinx dependencies
        run: pip install sphinx furo sphinx-autoapi

      - name: Build Python Sphinx documentation
        run: sphinx-build -M html . _build
        working-directory: packages/ducpy/docs

      - name: Stage Python API Docs
        run: |
          mkdir -p _site/reference/python
          cp -r packages/ducpy/docs/_build/html/. _site/reference/python/

      # 2. Setup Node.js for TypeDoc builds
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: bun install || npm ci

      # 3. TypeScript API Docs (ducjs TypeDoc -> /reference/typescript/)
      - name: Build TypeScript TypeDoc documentation (ducjs)
        run: npx typedoc
        working-directory: packages/ducjs

      - name: Stage TypeScript API Docs (ducjs)
        run: |
          mkdir -p _site/reference/typescript
          cp -r packages/ducjs/docs/. _site/reference/typescript/

      # 4. TypeScript API Docs (ducpdf TypeDoc -> /reference/pdf/)
      - name: Build TypeScript TypeDoc documentation (ducpdf)
        run: npx typedoc
        working-directory: packages/ducpdf

      - name: Stage TypeScript API Docs (ducpdf)
        run: |
          mkdir -p _site/reference/pdf
          cp -r packages/ducpdf/docs/. _site/reference/pdf/

      # 5. TypeScript API Docs (ducsvg TypeDoc -> /reference/svg/)
      - name: Build TypeScript TypeDoc documentation (ducsvg)
        run: npx typedoc
        working-directory: packages/ducsvg

      - name: Stage TypeScript API Docs (ducsvg)
        run: |
          mkdir -p _site/reference/svg
          cp -r packages/ducsvg/docs/. _site/reference/svg/

      # 6. Rust API Docs (cargo doc -> /reference/rust/)
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust cargo documentation
        run: cargo doc --no-deps
        working-directory: packages/ducrs

      - name: Stage Rust API Docs
        run: |
          mkdir -p _site/reference/rust
          cp -r target/doc/. _site/reference/rust/
          mkdir -p _site/reference/static.files
          cp -r target/doc/static.files/. _site/reference/static.files/

      # 7. PEP 503 Simple Package Index
      - name: Build PEP 503 Simple Package Index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-ducpy-simple-index.py _site

      - name: Setup Pages
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to gh-pages branch (for jsDelivr CDN)
        if: ${{ inputs.dry_run != true }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages

  deploy:
    if: ${{ inputs.dry_run != true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
